const alternatives={};
const replacementMetadata=gymCatalog;
function exerciseGroup(item){return item[1]}
for(const plan of plans)for(const item of plan.items){
    if(item[1]!=='Condicionamento')alternatives[item[0]]=Object.keys(gymCatalog).filter(name=>name!==item[0]&&gymCatalog[name].group===item[1]);
}
function slotKeyAt(planIndex,index){return 'academia-20261124-'+planIndex+'-'+plans[planIndex].items[index][6]}
function normalizedExerciseName(name) {return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim()}
function selectedWeekExercises() {
    const selected=new Map();
    // Reserve even the original movements. A replacement must not be an
    // exercise already present anywhere in the five-day base schedule.
    const used=new Set(plans.flatMap(plan=>plan.items.filter(item=>item[1]!=='Condicionamento').map(item=>normalizedExerciseName(item[0]))));
    for (let planIndex=0;planIndex<plans.length;planIndex++) {
        plans[planIndex].items.forEach((item,index)=>{
            const id=slotKeyAt(planIndex,index), candidate=db.swaps[id];
            if (candidate && alternatives[item[0]]?.includes(candidate) && !used.has(normalizedExerciseName(candidate))) {
                selected.set(id,candidate);
                used.add(normalizedExerciseName(candidate));
            } else selected.set(id,item[0]);
        });
    }
    return selected;
}
function availableReplacements(index) {
    const item=plans[day].items[index],id=slotKey(index),selected=selectedWeekExercises();
    const used=new Set(plans.flatMap(plan=>plan.items.filter(e=>e[1]!=='Condicionamento').map(e=>normalizedExerciseName(e[0]))));
    for (const [other,name] of selected) if(other!==id) used.add(normalizedExerciseName(name));
    return (alternatives[item[0]]||[]).filter(name=>!used.has(normalizedExerciseName(name)));
}
function exerciseNameHTML(index){
    const item=plans[day].items[index],name=selectedExercise(index);
    if(item[1]==='Condicionamento')return `<b>${index+1}. ${esc(name)}</b>`;
    return `<button type="button" id="exercise-name-${index}" class="exercise-name" aria-haspopup="dialog" aria-label="Trocar exercício: ${esc(name)}" onclick="event.preventDefault();event.stopPropagation();openExercisePicker(${index})">${index+1}. ${esc(name)}<span aria-hidden="true">▾</span></button>`;
}
let pickerIndex=-1;
function openExercisePicker(index){
    pickerIndex=index;
    const item=plans[day].items[index],selected=selectedExercise(index);
    const names=[item[0],...availableReplacements(index)];
    document.getElementById('picker-title').textContent='Trocar exercício';
    document.getElementById('picker-group').textContent='Treino '+'ABCDE'[day]+' • '+item[1];
    document.getElementById('picker-options').innerHTML=names.map(name=>`<button type="button" class="picker-option ${selected===name?'chosen':''}" ${selected===name?'aria-current="true"':''} data-choice="${esc(name)}"><strong>${esc(name)} ${selected===name?'✓':''}</strong><small>${esc(gymCatalog[name]?.equipment||'')}</small></button>`).join('');
    document.querySelectorAll('#picker-options [data-choice]').forEach(button=>button.addEventListener('click',()=>{
        const value=button.dataset.choice===item[0]?'':button.dataset.choice;
        document.getElementById('exercisePicker').close();
        if(swapExercise(slotKey(index),value))document.getElementById('exercise-name-'+index)?.focus();

}

function cycleWeeksElapsed(){

}
function weekNo(){return Math.min(8,cycleWeeksElapsed()+1)}
function renewalHTML(){

}
function slotKey(i){return slotKeyAt(day,i)}
function selectedExercise(i){return selectedWeekExercises().get(slotKey(i)) || plans[day].items[i][0]}
function entryKey(i){return [db.cycle,weekNo(),'academia20261124',day,plans[day].items[i][6],encodeURIComponent(selectedExercise(i))].join(':')}
function migrateGymRecords(){
    if(db.gymLayoutVersion==='20261124')return;
    for(let d=0;d<plans.length;d++)plans[d].items.forEach(item=>{
        const oldIndex=legacyLayout[d].items.findIndex(e=>e[0]===item[0]);
        if(oldIndex<0)return;
        const oldItem=legacyLayout[d].items[oldIndex],oldSlot=d+'-'+oldIndex+(oldItem[6]?'-'+oldItem[6]:'');
        const candidate=db.swaps[oldSlot];
        if(candidate&&alternatives[item[0]]?.includes(candidate))db.swaps[slotKeyAt(d,plans[d].items.indexOf(item))]=candidate;
        for(const collection of [db.entries,db.completed])for(const [key,value] of Object.entries(collection)){
            const parts=key.split(':');
            if(parts[2]!==String(d)||parts[3]!==String(oldIndex))continue;
            let name=item[0];
            if(parts.length>4&&parts[4]!==oldItem[6]){
                try{name=decodeURIComponent(parts.slice(4).join(':'))}catch{continue}
            }
            if(name!==item[0]&&!alternatives[item[0]]?.includes(name))continue;
            const destination=[parts[0],parts[1],'academia20261124',d,item[6],encodeURIComponent(name)].join(':');
            if(!Object.hasOwn(collection,destination))collection[destination]=Array.isArray(value)?[...value]:{...value};
        }
    });
    db.gymLayoutVersion='20261124';save();
}
function workoutBlocksHTML(plan){
    let previous='';
    return plan.items.map((item,index)=>{
        const group=item[1];
        const heading=group!==previous?`<h3 class="workout-group-heading">${group==='Condicionamento'?'Cardio diário':esc(group)}</h3>`:'';
        previous=group;return heading+exercise(item,index);
    }).join('');
}
function completedSetCount(i){return (db.completed[entryKey(i)]||[]).filter(Boolean).length}
function getProgress(){
    return plans[day].items.reduce((progress,item,index)=>{
        if (!item[7]) {
            progress.t+=item[2];
            progress.done+=completedSetCount(index);
        }
        return progress;
    },{t:0,done:0});
}
function markSet(i,s,checked){let k=entryKey(i),arr=db.completed[k]||[];arr[s]=checked;db.completed[k]=arr;save();let el=document.getElementById('sc'+i);if(el)el.textContent=completedSetCount(i)+'/'+plans[day].items[i][2]+' séries marcadas';let p=getProgress(),out=document.getElementById('setsProgress');if(out)out.textContent=p.done+'/'+p.t+' séries marcadas';let b=document.getElementById('progressBar');if(b)b.style.width=(p.t?100*p.done/p.t:0)+'%'}
function setEntry(i,which,value){let k=entryKey(i);db.entries[k]=Object.assign({},db.entries[k]||{},{[which]:value});save()}
function render(){document.getElementById('tabs').innerHTML=[['treino','Treino'],['diario','Diário'],['cardio','Cardio'],['historico','Histórico']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');let a=document.getElementById('app');if(tab==='treino'){let p=plans[day],progress=getProgress();a.innerHTML=`<section class="card"><b>Calendário semanal</b><p class="muted tiny">Ciclo ${db.cycle} • Semana ${weekNo()}/8</p><div class="days">${['Seg A','Ter B','Qua C','Qui D','Sex E'].map((x,i)=>`<button class="${i===day?'active':''}" onclick="day=${i};render()"><strong>${x.slice(-1)}</strong><span>${x.slice(0,3)}</span></button>`).join('')}</div></section>${renewalHTML()}<section class="card overview"><h2>Treino ${p.title}</h2><small>Objetivo: emagrecimento e definição</small><div class="progress"><span id="progressBar" style="width:${progress.t?100*progress.done/progress.t:0}%"></span></div><small id="setsProgress">${progress.done}/${progress.t} séries marcadas</small></section><p class="muted tiny">Carga leve a moderada, sem esforço máximo. Interrompa se houver tontura, tremores, suor frio, dor intensa ou formigamento. Se usa medicamentos para diabetes, acompanhe a glicemia conforme orientação profissional.</p>${workoutBlocksHTML(p)}<button class="primary" style="width:100%" onclick="finish()">Concluir treino e salvar</button><details class="card"><summary>Créditos das imagens</summary><p class="tiny">Fotos de exercícios: Free Exercise DB (domínio público, Unlicense). </p></details>`;}
else if(tab==='diario')a.innerHTML=`<h2>Diário de treino e recuperação</h2><section class="card"><label>Treino</label><select id="dw">${plans.map((_,i)=>`<option value="${i}">${'ABCDE'[i]}</option>`)}</select><label>Como me senti?</label><textarea id="note" placeholder="Ex.: dor nas coxas, cansaço maior, formigamento..."></textarea><label>Região dolorida</label><input id="region" placeholder="Ex.: coxas"><label>Dor (0 a 10)</label><input type="number" min="0" max="10" id="pain" value="0"><label>Cansaço (0 a 10)</label><input type="number" min="0" max="10" id="fatigue" value="0"><label><input type="checkbox" id="tingle" style="width:auto"> Formigamento</label><button class="primary" onclick="addDiary()">Salvar anotação</button></section>${db.diary.map(x=>`<div class="card"><b>${x.date} • Treino ${x.workout}</b><p>${esc(x.note)}</p><small>Região: ${esc(x.region)} • Dor ${x.pain}/10 • Cansaço ${x.fatigue}/10 ${x.tingle?'• Formigamento':''}</small></div>`).join('')}`;
else if(tab==='cardio')a.innerHTML=`<h2>Caminhada e corrida</h2><section class="card"><label>Atividade</label><select id="activity"><option>Caminhada</option><option>Esteira</option><option>Corrida</option><option>Bicicleta</option><option>Elíptico</option></select><div id="clock">${fmt(seconds)}</div><div class="row"><button onclick="startClock('Cardio')">Iniciar / Retomar</button><button onclick="pauseClock()">Pausar</button><button onclick="resetClock()">Zerar</button></div><label>Distância (km, preenchimento manual)</label><input id="distance" type="number" min="0" step="0.01" placeholder="Ex.: 2.5"><button class="primary" onclick="addCardio()">Salvar atividade</button><small>Distância automática por GPS não está disponível nesta versão.</small></section>${db.cardio.map(x=>`<div class="card">${x.date} • ${esc(x.kind)} • ${x.time} • ${x.km} km</div>`).join('')}`;
else a.innerHTML=`<h2>Histórico e ciclos</h2>${renewalHTML()}<section class="card"><b>Ciclo ${db.cycle}</b><p>Início: ${db.start}</p><p>${db.logs.filter(x=>x.cycle===db.cycle).length} treinos concluídos neste ciclo.</p><button onclick="newCycle()">Encerrar ciclo e iniciar semana 1</button><small>O reinício não apaga os resultados anteriores. Confirme apenas depois de completar as oito semanas.</small></section>${progressionHTML()}${db.logs.map(x=>`<div class="card"><b>${x.date} • Ciclo ${x.cycle} • Semana ${x.week||"-"} • Treino ${x.workout}</b><p>${x.done??"-"}/${x.total??"-"} séries concluídas</p><p>${x.items.map(y=>`${esc(y.name)}: ${y.sets} séries, ${y.reps} reps, ${y.kg} kg`).join('<br>')}</p></div>`).join('')}`;
}
function exerciseTarget(item,name) {
    if (name===item[0]) return item[3];
    if (replacementMetadata[name]) return replacementMetadata[name].target;
    for(const plan of plans){const original=plan.items.find(e=>e[0]===name);if(original)return original[3]}
    if (name==='Prancha') return '20–30 s';
    if (name==='Leg press unilateral') return '10–12 por perna';
    
    return item[3];
}
function exercise(e,i){let id=slotKey(i), name=selectedExercise(i),target=exerciseTarget(e,name),k=entryKey(i),values=db.entries[k]||{},checked=db.completed[k]||[],photos=exerciseImages[name]||[],clockId=k.replaceAll(':','-');
    return `<details class="card exercise-card" ${expandedExercises.has(id)?'open':''} ontoggle="this.open?expandedExercises.add('${id}'):expandedExercises.delete('${id}')"><summary>
    ${photos.length?`<img class="exercise-thumb" loading="lazy" src="images/${photos[0]}" alt="">`:'<span class="exercise-thumb no-thumb">Sem foto<br>específica</span>'}
    <span><span class="exercise-group">${e[1]}</span>${exerciseNameHTML(i)}${e[7]?'<small class="exercise-meta">Opcional</small>':''}<small class="exercise-meta">${e[2]} séries × ${target} · ${e[4]} s de descanso</small><small id="sc${i}" class="exercise-meta">${completedSetCount(i)}/${e[2]} séries marcadas</small><small class="exercise-meta">Ver séries e cronômetros ⌄</small></span>
    </summary><div class="exercise-clocks">${exerciseClockHTML(clockId,'execution',executionDuration(target))}${exerciseClockHTML(clockId,'rest',e[4])}</div>
    ${exercisePictures(photos,name)}<p class="tiny muted">${esc(gymCatalog[name]?.equipment||'Esteira')}</p><p class="tiny">${esc(selectedInstruction(e,name))}</p><p><button type="button" class="exercise-history" onclick="showExerciseProgress(${i})">Ver evolução</button></p><div class="sets">${Array.from({length:e[2]},(_,s)=>`<label><input type="checkbox" ${checked[s]?'checked':''} onchange="markSet(${i},${s},this.checked)">Série ${s+1}</label>`).join('')}</div><div class="row"><label>Séries<input id="s${i}" type="number" min="0" value="${esc(values.sets??e[2])}" oninput="setEntry(${i},'sets',this.value)"></label><label>${/ (?:s|min)$/.test(target)?'Tempo':'Reps'}<input id="r${i}" type="number" min="0" value="${esc(values.reps??parseInt(target)??10)}" oninput="setEntry(${i},'reps',this.value)"></label><label>Kg<input id="k${i}" type="number" min="0" step="0.5" value="${esc(values.kg??0)}" oninput="setEntry(${i},'kg',this.value)"></label></div></details>`}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function updateClock(){const clock=document.getElementById('clock');if(clock)clock.textContent=fmt(seconds)}
function startClock(){if(running)return;running=true;lastTick=Date.now();timer=setInterval(()=>{const elapsed=Math.floor((Date.now()-lastTick)/1000);if(elapsed>0){seconds+=elapsed;lastTick+=elapsed*1000;updateClock()}},250)}
function pauseClock(){running=false;clearInterval(timer)}
function resetClock(){pauseClock();seconds=0;updateClock()}
function swapExercise(id,value){
    const index=plans[day].items.findIndex((_,i)=>slotKey(i)===id);
    if(index<0)return false;
    if(value && !availableReplacements(index).includes(value)){
        alert('Este exercício já está no treino ou não é uma alternativa deste grupo. Escolha outra opção.');
        render();return false;
    }
    if((value||plans[day].items[index][0])===selectedExercise(index))return true;
    const clockPrefix=entryKey(index).replaceAll(':','-');
    for(const mode of ['execution','rest']) {
        const clock=exerciseClocks.get(clockPrefix+'-'+mode);
        if(clock?.until){clock.remaining=Math.max(0,clock.until-Date.now());clock.until=null;}
    }
    if(value)db.swaps[id]=value;else delete db.swaps[id];
    save();render();return true;
}function finish(){let p=plans[day],progress=getProgress();if(!p.items.some((_,index)=>completedSetCount(index)>0)&&!confirm('Nenhuma série foi marcada como concluída. Deseja salvar mesmo assim?'))return;db.logs.unshift({date:new Date().toLocaleString('pt-BR'),loggedAt:Date.now(),cycle:db.cycle,week:weekNo(),workout:'ABCDE'[day],done:progress.done,total:progress.t,items:p.items.map((e,i)=>{let v=db.entries[entryKey(i)]||{};return {name:selectedExercise(i),sets:v.sets??e[2],reps:v.reps??exerciseTarget(e,selectedExercise(i)),kg:v.kg??0,completed:completedSetCount(i)}}).filter((item,index)=>!p.items[index][7]||item.completed>0)});save();alert('Treino salvo no aparelho.');tab='historico';render()}
function addDiary(){db.diary.unshift({date:new Date().toLocaleString('pt-BR'),workout:'ABCDE'[+document.getElementById('dw').value],note:document.getElementById('note').value,region:document.getElementById('region').value,pain:document.getElementById('pain').value,fatigue:document.getElementById('fatigue').value,tingle:document.getElementById('tingle').checked});save();render()}function addCardio(){db.cardio.unshift({date:new Date().toLocaleString('pt-BR'),kind:document.getElementById('activity').value,time:fmt(seconds),km:document.getElementById('distance').value||0});save();pauseClock();seconds=0;render()}function newCycle(){if(cycleWeeksElapsed()<8&&!confirm('Ainda não se passaram 8 semanas. Deseja mesmo iniciar um novo ciclo mantendo todos os registros?'))return;if(!confirm('Iniciar novo ciclo? Os resultados anteriores serão preservados.'))return;db.cycle++;db.start=today();save();render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}migrateGymRecords();render();
</script></body></html>
