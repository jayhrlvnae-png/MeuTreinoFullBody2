<header><h1>MEU TREINO FULL BODY 2</h1><small>Offline • Treinos de segunda a sexta</small></header><div id="app"></div><nav class="tabs" id="tabs"></nav><script src="exercise-images.js"></script><script src="workout-timers.js"></script><script src="progression.js"></script><script>
const key='meutreinofullbody2_v1', old=JSON.parse(localStorage.getItem(key)||'{}');let db={cycle:1,start:today(),logs:[],diary:[],cardio:[],swaps:{},entries:{},completed:{},...old};function save(){localStorage.setItem(key,JSON.stringify(db))}function today(){const now=new Date();return new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10)}const expandedExercises = new Set();let tab='treino',day=Math.min(4,(new Date().getDay()+6)%7);let timer=null,seconds=0,running=false,lastTick=0;
const plans=[
{title:'A — Peito, costas e braços',items:[['Supino reto na máquina','Peito',3,'8–12',90,'supino','supino-reto-maquina'],['Remada sentada','Costas',3,'10–12',90,'remada'],['Agachamento na V-Squat (de frente)','Quadríceps',3,'10–12',90,'agachamento','maquina-ombros'],['Crucifixo na máquina','Peito',3,'10–12',60,'crucifixo'],['Rosca alternada','Bíceps',3,'10–12',60,'rosca'],['Prancha','Abdômen',3,'20–30 s',60,'prancha']]},
{title:'B — Ombros, posterior e panturrilha',items:[['Desenvolvimento sentado','Ombros',3,'8–12',90,'desenvolvimento'],['Puxada frontal','Costas',3,'10–12',90,'puxada'],['Mesa flexora','Posterior da coxa',3,'10–12',75,'flexora'],['Panturrilha no leg press','Panturrilha',3,'12–15',60,'panturrilha','panturrilha-leg-press'],['Tríceps na polia','Tríceps',3,'10–12',60,'triceps'],['Abdominal curto','Abdômen',3,'12–15',60,'abdominal']]},

{title:'D — Peito, costas e braços',items:[['Pullover com halter','Peito e costas',3,'8–12',90,'pullover','pullover'],['Puxada com braços estendidos','Costas',3,'10–12',90,'puxada-estendida','puxada-estendida'],['Crucifixo na polia','Peito',3,'12',60,'crucifixo','crucifixo-polia'],['Remada unilateral','Costas',3,'10 cada',75,'remada'],['Rosca direta','Bíceps',3,'10–12',60,'rosca'],['Tríceps corda','Tríceps',3,'10–12',60,'triceps']]},
{title:'E — Corpo inteiro e condicionamento',items:[['Leg press leve','Pernas',3,'10–12',90,'legpress'],['Panturrilha em pé','Panturrilha',3,'12–15',60,'panturrilha','panturrilha-em-pe'],['Flexora sentada','Posterior da coxa',3,'10–12',75,'flexora','flexora-sentada'],['Remada máquina','Costas',3,'10–12',75,'remada'],['Elevação frontal com halteres','Ombros',3,'12–15',60,'frontal','elevacao-frontal'],['Abdominal reverso','Abdômen',3,'12',60,'abdominal']]}
];plans[0].items.push(['Cadeira extensora','Quadríceps',3,'12',75,'agachamento']);plans[1].items.push(['Elevação lateral','Ombros',3,'12',60,'lateral']);plans[2].items.push(['Cadeira adutora','Quadril',3,'12',60,'adutora','cadeira-adutora']);plans[3].items.push(['Abdominal bicicleta','Abdômen',3,'8 cada lado',60,'bicicleta','abdominal-bicicleta']);plans[4].items.push(['Flexão inclinada no banco','Peito',3,'8–12',60,'flexao-banco','flexao-banco']);plans[4].items.push(['Cadeira abdutora','Quadril',3,'12',60,'abdutora','cadeira-quadril',true]);
plans[1].items.push(['Supino no chão com halteres','Peito',3,'8–12',75,'supino','supino-chao']);

const cardioName='Esteira ou caminhada';
for (const [index, plan] of plans.entries()) {
    if (index===2) {
        plan.items[0][0]=cardioName;
    } else {
        plan.items.push([cardioName,'Condicionamento',1,'10 min',30,'caminhada','cardio-diario']);
    }
}
plans[0].items.push(
    ['Crucifixo inverso com halteres','Ombros e costas',3,'8–12',75,'inverso','crucifixo-inverso'],
    ['Abdominal oblíquo no solo','Abdômen',3,'8 cada lado',60,'abdominal','abdominal-obliquo']
);
plans[1].items.push(['Sentar e levantar do banco','Pernas',3,'8–12',75,'banco','sentar-levantar']);
plans[2].items.push(
    ['Remada curvada com dois halteres','Costas',3,'8–12',75,'remada','remada-curvada'],
    ['Inclinação pélvica em pé','Abdômen',3,'8–12',60,'pelve','inclinacao-pelvica']
);
plans[3].items.push(['Flexora em pé','Posterior da coxa',3,'8 por perna',75,'flexora','flexora-em-pe']);
plans[4].items.push(['Supino em pé na polia','Peito',3,'8–12',75,'supino','supino-polia']);
const alternatives={

// The catalog contains full metadata for the chosen movement. Replaced slots
// retain their original keys; logs and loads remain attached to the actual name.
const replacementMetadata = {
  "Stiff na V-Squat": {"group":"Posterior da coxa","target":"10–12","instruction":"Confirme com o instrutor o ajuste da V-Squat para o stiff, os apoios e as travas. Use o movimento de quadril orientado para esse aparelho, sem transformar o exercício em agachamento."},
  "Abdominal na polia alta": {
    "group": "Abdômen",
    "target": "12",
    "instruction": "Ajoelhe diante da polia alta com a corda junto à cabeça. Flexione o tronco de forma controlada, sem puxar com os braços."
  },
  "Prancha lateral": {
    "group": "Abdômen",
    "target": "20–30 s",
    "instruction": "De lado, apoie o antebraço e mantenha o corpo alinhado, respirando normalmente."
  },
  "Abdominal com braços estendidos": {

const originalAlternatives = Object.fromEntries(Object.entries(alternatives).map(([name,options])=>[name,[...options]]));
function exerciseGroup(item) {
    if (item[5]==='adutora') return 'Adutores';
    if (item[5]==='abdutora') return 'Abdutores';
    return ({'Quadríceps':'Pernas','Peito e costas':'Costas','Ombros e costas':'Ombros'})[item[1]] || item[1];
}
const replacementGroups = new Map();
for (const plan of plans) for (const item of plan.items) {
    if (item[1]==='Condicionamento') continue;
    const group=exerciseGroup(item);
    if (!replacementGroups.has(group)) replacementGroups.set(group,new Set());
    for (const name of [item[0],...(originalAlternatives[item[0]]||[])]) replacementGroups.get(group).add(name);
}
for (const [name,metadata] of Object.entries(replacementMetadata)) {
    const group=metadata.group==='Quadríceps'?'Pernas':metadata.group;
    if (!replacementGroups.has(group)) replacementGroups.set(group,new Set());
    replacementGroups.get(group).add(name);
}
for (const plan of plans) for (const item of plan.items) {
    if (item[1]!=='Condicionamento') alternatives[item[0]]=[...replacementGroups.get(exerciseGroup(item))].filter(name=>name!==item[0]);
}
function slotKeyAt(planIndex,index) {
    const revision=plans[planIndex].items[index][6];
    return planIndex+'-'+index+(revision?'-'+revision:'');
}
function normalizedExerciseName(name) {return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim()}
function selectedWeekExercises() {
    const selected=new Map();
    // Reserve even the original movements. A replacement must not be an
    // exercise already present anywhere in the five-day base schedule.
    const used=new Set(plans.flatMap(plan=>plan.items.filter(item=>item[1]!=='Condicionamento').map(item=>normalizedExerciseName(item[0]))));
    for (let planIndex=0;planIndex<plans.length;planIndex++) {
        plans[planIndex].items.forEach((item,index)=>{
            const id=slotKeyAt(planIndex,index), candidate=db.swaps[id];
            if (candidate && alternatives[item[0]]?.includes(candidate) && !used.has(normalizedExerciseName(candidate))) {
                selected.set(id,candidate);
                used.add(normalizedExerciseName(candidate));
            } else selected.set(id,item[0]);
        });
    }
    return selected;
}
function availableReplacements(index) {
    const item=plans[day].items[index],id=slotKey(index),selected=selectedWeekExercises();
    const used=new Set(plans.flatMap(plan=>plan.items.filter(e=>e[1]!=='Condicionamento').map(e=>normalizedExerciseName(e[0]))));
    for (const [other,name] of selected) if(other!==id) used.add(normalizedExerciseName(name));
    return (alternatives[item[0]]||[]).filter(name=>!used.has(normalizedExerciseName(name)));
}
function replacementHTML(index) {
    const item=plans[day].items[index];
    if (item[1]==='Condicionamento') return '';
    const id=slotKey(index),selected=selectedExercise(index),options=availableReplacements(index);
    return `<details class="swap-picker"><summary>Trocar exercício</summary>
    <p class="tiny muted">Alternativas para ${esc(exerciseGroup(item).toLocaleLowerCase('pt-BR'))}, sem repetir os exercícios dos treinos A–E. A escolha fica salva neste aparelho. Use uma opção com equipamento disponível e execução orientada.</p>
    <label for="swap-${id}">Escolher outro exercício</label>
    <select id="swap-${id}" onchange="swapExercise('${id}',this.value)">
      <option value="" ${selected===item[0]?'selected':''}>${esc(item[0])} (principal)</option>
      ${options.map(name=>`<option value="${esc(name)}" ${name===selected?'selected':''}>${esc(name)}</option>`).join('')}
    </select>
    ${options.length?'':'<p class="tiny muted">As alternativas deste grupo já estão nos outros treinos. Não foi oferecido um exercício repetido.</p>'}
    ${selected!==item[0]?`<button type="button" style="margin-top:10px" onclick="swapExercise('${id}','')">Voltar ao exercício principal</button>`:''}
    </details>`;
}
function selectedInstruction(item,name) {
    if (replacementMetadata[name]) return replacementMetadata[name].instruction;
    if (name!==item[0]) {
        for(const plan of plans) {const source=plan.items.find(e=>e[0]===name);if(source)return instructions[source[5]]||'Execute de forma lenta, controlada e sem dor.'}
        return 'Ajuste o equipamento para esta alternativa e execute com controle, sem dor. Confirme a técnica com o instrutor.';
    }
    if(name==='Agachamento na V-Squat (de frente)')return 'Confirme o ajuste e as travas do aparelho com o instrutor da academia.';
    if(name==='Cadeira extensora')return 'Sentado, estenda os joelhos com controle e baixe o apoio devagar.';
    return instructions[item[5]]||'Execute de forma lenta, controlada e sem dor.';
}

const instructions={

degrau:'Use um degrau baixo e firme. Suba e desça com controle, alternando as pernas.',
banco:'Sente e levante de um banco firme com os pés apoiados.',
inverso:'Incline o tronco e abra os braços com os cotovelos levemente dobrados.',
pelve:'Em pé, incline suavemente a pelve e volte à posição inicial, respirando normalmente.',

'elevacao-pernas':'Deite de costas no colchonete, com as pernas estendidas. Eleve os pés um pouco e volte devagar. Use uma amplitude em que você consiga manter a lombar apoiada.',

'face-pull':'Puxe a corda na direção do rosto e retorne com controle.',

abdutora:'Use o ajuste de abertura das pernas na cadeira conjugada.',supino:'Deitado ou sentado, mantenha os ombros estáveis, empurre à frente e retorne devagar.',remada:'Puxe os cotovelos para trás com tronco estável; retorne de modo controlado.',agachamento:'Flexione quadris e joelhos até uma amplitude confortável, mantendo os pés apoiados.',crucifixo:'Aproxime os braços à frente do peito sem forçar a articulação do ombro.',rosca:'Flexione os cotovelos sem balançar o tronco; retorne lentamente.',prancha:'Mantenha o tronco alinhado e respire normalmente.',desenvolvimento:'Empurre os pesos para cima sem arquear a lombar.',puxada:'Puxe a barra à frente do peito, aproximando as escápulas.',flexora:'Flexione os joelhos contra resistência com movimento controlado.',panturrilha:'Eleve os calcanhares e desça lentamente sem quicar.',triceps:'Estenda os cotovelos mantendo os braços próximos ao tronco.',abdominal:'Contraia o abdômen sem puxar o pescoço.',caminhada:'Caminhe em ritmo confortável e mantenha-se hidratado.',flexao:'Apoie as mãos na parede e flexione os cotovelos com o tronco alinhado.',ponte:'Deitado, eleve o quadril suavemente e retorne.',legpress:'Empurre a plataforma sem travar os joelhos; use amplitude confortável.',lateral:'Eleve os braços lateralmente até altura confortável, sem impulso.'};
function exercisePictures(photos, name) {
    const reference = name==='Subida no degrau' ? '<p class="muted tiny">Na sessão, faça a subida sem halteres.</p>' : name==='Elevação curta de pernas estendidas' ? '<p class="muted tiny">Foto de referência no banco. No Treino C, faça no colchonete com elevação curta.</p>' : '';
    return photos.length ? reference+`<div class="exercise-photos">${photos.map((path,i)=>`<figure><img loading="lazy" src="images/${path}" alt="${esc(name)}${photos.length>1?' — '+(i?'fim do movimento':'posição inicial'):''}">${photos.length>1?`<figcaption>${i?'Fim do movimento':'Posição inicial'}</figcaption>`:''}</figure>`).join('')}</div>` : '';
}
function cycleWeeksElapsed(){
    return Math.max(0, Math.floor((Date.parse(today())-Date.parse(db.start))/604800000));
}
function weekNo(){return Math.min(8,cycleWeeksElapsed()+1)}
function renewalHTML(){
    return cycleWeeksElapsed()>=8 ? `<section class="card renewal"><p>As oito semanas deste ciclo terminaram.</p><button class="primary" onclick="newCycle()">Iniciar novo ciclo</button></section>` : '';
}
function slotKey(i){return slotKeyAt(day,i)}
function selectedExercise(i){return selectedWeekExercises().get(slotKey(i)) || plans[day].items[i][0]}
function entryKey(i){
    const item=plans[day].items[i], name=selectedExercise(i);
    const base=[db.cycle,weekNo(),day,i].join(':');
    if (name!==item[0]) return base+':'+encodeURIComponent(name);
    return item[6] ? base+':'+item[6] : base;
}
function completedSetCount(i){return (db.completed[entryKey(i)]||[]).filter(Boolean).length}
function getProgress(){
    return plans[day].items.reduce((progress,item,index)=>{
        if (!item[7]) {
            progress.t+=item[2];
            progress.done+=completedSetCount(index);
        }
        return progress;
    },{t:0,done:0});
}
function markSet(i,s,checked){let k=entryKey(i),arr=db.completed[k]||[];arr[s]=checked;db.completed[k]=arr;save();let el=document.getElementById('sc'+i);if(el)el.textContent=completedSetCount(i)+'/'+plans[day].items[i][2]+' séries marcadas';let p=getProgress(),out=document.getElementById('setsProgress');if(out)out.textContent=p.done+'/'+p.t+' séries marcadas';let b=document.getElementById('progressBar');if(b)b.style.width=(p.t?100*p.done/p.t:0)+'%'}
function setEntry(i,which,value){let k=entryKey(i);db.entries[k]=Object.assign({},db.entries[k]||{},{[which]:value});save()}
function render(){document.getElementById('tabs').innerHTML=[['treino','Treino'],['diario','Diário'],['cardio','Cardio'],['historico','Histórico']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('');let a=document.getElementById('app');if(tab==='treino'){let p=plans[day],progress=getProgress();a.innerHTML=`<section class="card"><b>Calendário semanal</b><p class="muted tiny">Ciclo ${db.cycle} • Semana ${weekNo()}/8</p><div class="days">${['Seg A','Ter B','Qua C','Qui D','Sex E'].map((x,i)=>`<button class="${i===day?'active':''}" onclick="day=${i};render()"><strong>${x.slice(-1)}</strong><span>${x.slice(0,3)}</span></button>`).join('')}</div></section>${renewalHTML()}<section class="card overview"><h2>Treino ${p.title}</h2><small>Objetivo: emagrecimento e definição</small><div class="progress"><span id="progressBar" style="width:${progress.t?100*progress.done/progress.t:0}%"></span></div><small id="setsProgress">${progress.done}/${progress.t} séries marcadas</small></section><p class="muted tiny">Carga leve a moderada, sem esforço máximo. Interrompa se houver tontura, tremores, suor frio, dor intensa ou formigamento. Se usa medicamentos para diabetes, acompanhe a glicemia conforme orientação profissional.</p>${p.items.map((e,i)=>exercise(e,i)).join('')}<button class="primary" style="width:100%" onclick="finish()">Concluir treino e salvar</button><details class="card"><summary>Créditos das imagens</summary><p class="tiny">Fotos de exercícios: Free Exercise DB (domínio público, Unlicense). </p></details>`;}
else if(tab==='diario')a.innerHTML=`<h2>Diário de treino e recuperação</h2><section class="card"><label>Treino</label><select id="dw">${plans.map((_,i)=>`<option value="${i}">${'ABCDE'[i]}</option>`)}</select><label>Como me senti?</label><textarea id="note" placeholder="Ex.: dor nas coxas, cansaço maior, formigamento..."></textarea><label>Região dolorida</label><input id="region" placeholder="Ex.: coxas"><label>Dor (0 a 10)</label><input type="number" min="0" max="10" id="pain" value="0"><label>Cansaço (0 a 10)</label><input type="number" min="0" max="10" id="fatigue" value="0"><label><input type="checkbox" id="tingle" style="width:auto"> Formigamento</label><button class="primary" onclick="addDiary()">Salvar anotação</button></section>${db.diary.map(x=>`<div class="card"><b>${x.date} • Treino ${x.workout}</b><p>${esc(x.note)}</p><small>Região: ${esc(x.region)} • Dor ${x.pain}/10 • Cansaço ${x.fatigue}/10 ${x.tingle?'• Formigamento':''}</small></div>`).join('')}`;
else if(tab==='cardio')a.innerHTML=`<h2>Caminhada e corrida</h2><section class="card"><label>Atividade</label><select id="activity"><option>Caminhada</option><option>Esteira</option><option>Corrida</option></select><div id="clock">${fmt(seconds)}</div><div class="row"><button onclick="startClock('Cardio')">Iniciar / Retomar</button><button onclick="pauseClock()">Pausar</button><button onclick="resetClock()">Zerar</button></div><label>Distância (km, preenchimento manual)</label><input id="distance" type="number" min="0" step="0.01" placeholder="Ex.: 2.5"><button class="primary" onclick="addCardio()">Salvar atividade</button><small>Distância automática por GPS não está disponível nesta versão.</small></section>${db.cardio.map(x=>`<div class="card">${x.date} • ${esc(x.kind)} • ${x.time} • ${x.km} km</div>`).join('')}`;
else a.innerHTML=`<h2>Histórico e ciclos</h2>${renewalHTML()}<section class="card"><b>Ciclo ${db.cycle}</b><p>Início: ${db.start}</p><p>${db.logs.filter(x=>x.cycle===db.cycle).length} treinos concluídos neste ciclo.</p><button onclick="newCycle()">Encerrar ciclo e iniciar semana 1</button><small>O reinício não apaga os resultados anteriores. Confirme apenas depois de completar as oito semanas.</small></section>${progressionHTML()}${db.logs.map(x=>`<div class="card"><b>${x.date} • Ciclo ${x.cycle} • Semana ${x.week||"-"} • Treino ${x.workout}</b><p>${x.done??"-"}/${x.total??"-"} séries concluídas</p><p>${x.items.map(y=>`${esc(y.name)}: ${y.sets} séries, ${y.reps} reps, ${y.kg} kg`).join('<br>')}</p></div>`).join('')}`;
}
function exerciseTarget(item,name) {
    if (name===item[0]) return item[3];
    if (replacementMetadata[name]) return replacementMetadata[name].target;
    for(const plan of plans){const original=plan.items.find(e=>e[0]===name);if(original)return original[3]}
    if (name==='Prancha') return '20–30 s';
    if (name==='Leg press unilateral') return '10–12 por perna';
    
    return item[3];
}
function exercise(e,i){let id=slotKey(i), name=selectedExercise(i),target=exerciseTarget(e,name),k=entryKey(i),values=db.entries[k]||{},checked=db.completed[k]||[],photos=exerciseImages[name]||[],clockId=k.replaceAll(':','-');
    return `<details class="card exercise-card" ${expandedExercises.has(id)?'open':''} ontoggle="this.open?expandedExercises.add('${id}'):expandedExercises.delete('${id}')"><summary>
    ${photos.length?`<img class="exercise-thumb" loading="lazy" src="images/${photos[0]}" alt="">`:'<span class="exercise-thumb no-thumb">Sem foto<br>específica</span>'}
    <span><span class="exercise-group">${e[1]}</span><b>${i+1}. ${esc(name)}</b>${e[7]?'<small class="exercise-meta">Opcional</small>':''}<small class="exercise-meta">${e[2]} séries × ${target} · ${e[4]} s de descanso</small><small id="sc${i}" class="exercise-meta">${completedSetCount(i)}/${e[2]} séries marcadas</small></span>
    </summary><div class="exercise-clocks">${exerciseClockHTML(clockId,'execution',executionDuration(target))}${exerciseClockHTML(clockId,'rest',e[4])}</div>
    ${exercisePictures(photos,name)}<p class="tiny">${esc(selectedInstruction(e,name))}</p>${replacementHTML(i)}${e[0]==='Crucifixo na polia'?'<p class="tiny muted">Use a estação de polia do tríceps corda. Se tiver uma única polia, escolha a versão unilateral.</p>':''}<p><button type="button" class="exercise-history" onclick="showExerciseProgress(${i})">Ver evolução</button></p><div class="sets">${Array.from({length:e[2]},(_,s)=>`<label><input type="checkbox" ${checked[s]?'checked':''} onchange="markSet(${i},${s},this.checked)">Série ${s+1}</label>`).join('')}</div><div class="row"><label>Séries<input id="s${i}" type="number" min="0" value="${esc(values.sets??e[2])}" oninput="setEntry(${i},'sets',this.value)"></label><label>${/ (?:s|min)$/.test(target)?'Tempo':'Reps'}<input id="r${i}" type="number" min="0" value="${esc(values.reps??parseInt(target)??10)}" oninput="setEntry(${i},'reps',this.value)"></label><label>Kg<input id="k${i}" type="number" min="0" step="0.5" value="${esc(values.kg??0)}" oninput="setEntry(${i},'kg',this.value)"></label></div></details>`}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function updateClock(){const clock=document.getElementById('clock');if(clock)clock.textContent=fmt(seconds)}
function startClock(){if(running)return;running=true;lastTick=Date.now();timer=setInterval(()=>{const elapsed=Math.floor((Date.now()-lastTick)/1000);if(elapsed>0){seconds+=elapsed;lastTick+=elapsed*1000;updateClock()}},250)}
function pauseClock(){running=false;clearInterval(timer)}
function resetClock(){pauseClock();seconds=0;updateClock()}
function swapExercise(id,value){
    const index=plans[day].items.findIndex((_,i)=>slotKey(i)===id);
    if(index<0)return false;
    if(value && !availableReplacements(index).includes(value)){
        alert('Este exercício já está no treino ou não é uma alternativa deste grupo. Escolha outra opção.');
        render();return false;
    }
    if((value||plans[day].items[index][0])===selectedExercise(index))return true;
    const clockPrefix=entryKey(index).replaceAll(':','-');
    for(const mode of ['execution','rest']) {
        const clock=exerciseClocks.get(clockPrefix+'-'+mode);
        if(clock?.until){clock.remaining=Math.max(0,clock.until-Date.now());clock.until=null;}
    }
    if(value)db.swaps[id]=value;else delete db.swaps[id];
    save();render();return true;
}function finish(){let p=plans[day],progress=getProgress();if(!p.items.some((_,index)=>completedSetCount(index)>0)&&!confirm('Nenhuma série foi marcada como concluída. Deseja salvar mesmo assim?'))return;db.logs.unshift({date:new Date().toLocaleString('pt-BR'),loggedAt:Date.now(),cycle:db.cycle,week:weekNo(),workout:'ABCDE'[day],done:progress.done,total:progress.t,items:p.items.map((e,i)=>{let v=db.entries[entryKey(i)]||{};return {name:selectedExercise(i),sets:v.sets??e[2],reps:v.reps??exerciseTarget(e,selectedExercise(i)),kg:v.kg??0,completed:completedSetCount(i)}}).filter((item,index)=>!p.items[index][7]||item.completed>0)});save();alert('Treino salvo no aparelho.');tab='historico';render()}
function addDiary(){db.diary.unshift({date:new Date().toLocaleString('pt-BR'),workout:'ABCDE'[+document.getElementById('dw').value],note:document.getElementById('note').value,region:document.getElementById('region').value,pain:document.getElementById('pain').value,fatigue:document.getElementById('fatigue').value,tingle:document.getElementById('tingle').checked});save();render()}function addCardio(){db.cardio.unshift({date:new Date().toLocaleString('pt-BR'),kind:document.getElementById('activity').value,time:fmt(seconds),km:document.getElementById('distance').value||0});save();pauseClock();seconds=0;render()}function newCycle(){if(cycleWeeksElapsed()<8&&!confirm('Ainda não se passaram 8 semanas. Deseja mesmo iniciar um novo ciclo mantendo todos os registros?'))return;if(!confirm('Iniciar novo ciclo? Os resultados anteriores serão preservados.'))return;db.cycle++;db.start=today();save();render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
